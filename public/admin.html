<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - ChatKlax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff, #00ffff);
      background-size: 400%;
      animation: neonGlow 8s ease-in-out infinite;
    }
    @keyframes neonGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .admin-container {
      background: rgba(47, 49, 54, 0.9);
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      color: white;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
    }
    .admin-container input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      background: #3c3c7a;
      border: none;
      border-radius: 4px;
      color: white;
    }
    .admin-container button {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      background: #ff4500;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .admin-container button:hover {
      background: #e03e00;
    }
    .admin-container .error-message {
      color: #ff6666;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
    }
    .admin-container .success-message {
      color: #66ff66;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h2 class="text-2xl font-bold text-center mb-4">Panel de Administración</h2>
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    <input id="admin-username" type="text" placeholder="Nombre de usuario" required>
    <input id="admin-password" type="password" placeholder="Contraseña" required>
    <button onclick="resetDatabase()">Limpiar Base de Datos</button>
  </div>

  <script>
    async function resetDatabase() {
      const adminUsername = document.getElementById('admin-username').value;
      const adminPassword = document.getElementById('admin-password').value;
      const errorMessage = document.getElementById('error-message');
      const successMessage = document.getElementById('success-message');

      // Limpiar mensajes previos
      errorMessage.style.display = 'none';
      errorMessage.textContent = '';
      successMessage.style.display = 'none';
      successMessage.textContent = '';

      if (!adminUsername || !adminPassword) {
        errorMessage.textContent = 'Por favor, ingresa el nombre de usuario y la contraseña.';
        errorMessage.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/reset-db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminUsername, adminPassword }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Error al limpiar la base de datos');
        }

        successMessage.textContent = 'Base de datos limpiada con éxito.';
        successMessage.style.display = 'block';
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.style.display = 'block';
      }
    }
  </script>
</body>
</html>
